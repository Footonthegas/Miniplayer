services:
  # Free Node service for development/testing. Render free web services can sleep
  # after inactivity; see README.md before using this for public paid subscriptions.
  - type: web
    name: mini-player-premium-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false
      - key: RAZORPAY_TOTAL_COUNT
        value: "12"
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # Public policy/support pages. Render static sites are served independently
  # from the API so the privacy policy remains available when the API sleeps.
  - type: web
    name: mini-player-legal-pages
    runtime: static
    buildCommand: 'echo "Static legal pages - no build needed"'
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
